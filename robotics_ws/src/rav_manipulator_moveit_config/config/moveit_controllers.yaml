# This file intentionally contains only the controller-manager payload.
# demo_ros2_control.launch.py wraps it in the parameter
# "moveit_simple_controller_manager" for the move_group node.
controller_names:
  - arm_controller

arm_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - shoulder_joint
    - elbow_joint
    - wrist_joint
    - gripper_pinion_joint
