default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  # Teto de 0.3 rad/s / 0.3 rad/s^2: o movimento pra cam_pose depois do
  # close_ibu (no pick) estava rapido demais. Travado aqui direto (nao
  # so no default_scaling_factor global) pelo mesmo motivo do
  # gripper_pinion_joint abaixo -- um request/slider explicito ignora o
  # default_scaling_factor, isso aqui e o teto de verdade.
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.6
    has_acceleration_limits: true
    max_acceleration: 0.6

  elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.6
    has_acceleration_limits: true
    max_acceleration: 0.6

  wrist_joint:
    has_velocity_limits: true
    max_velocity: 0.6
    has_acceleration_limits: true
    max_acceleration: 0.6

  # Teto de 0.5 rad/s / 0.5 rad/s^2: com 1.0 a gripper real nao consegue
  # nem abrir nem fechar (CONTROL_FAILED, error_code=-4), tanto via
  # pick quanto pelo slider de velocidade/aceleracao do RViz no maximo.
  # Definido aqui (nao so no default_scaling_factor global) pra travar
  # o teto de verdade, ja que um request/slider explicito em 1.0 ignora
  # o default_scaling_factor.
  gripper_pinion_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5
